<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meeting-personal-todo (demo)</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --primary: #2563eb;
      --primary-bg: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: #fafafa;
      color: var(--text);
      padding: 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    textarea {
      width: 100%;
      min-height: 160px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #e5e7eb; color: var(--text); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
    .error { color: #dc2626; font-size: 13px; }
    .result { margin-top: 12px; }
    .task {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      background: #f7f7f7;
    }
    .task .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .task .text { font-size: 15px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      background: var(--primary-bg);
      color: var(--primary);
      border-radius: 4px;
      padding: 2px 6px;
      margin-right: 6px;
    }
    .highlight-snippet {
      font-size: 13px;
      color: var(--muted);
      border-left: 3px solid var(--border);
      padding-left: 8px;
      margin-top: 6px;
    }
    .save-url {
      font-size: 13px;
      word-break: break-all;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>회의 개인 할 일 추출 (데모)</h1>
    <p class="subtitle">텍스트를 붙여넣으면 내 담당 항목만 뽑아줍니다. (Solar Pro 4 mock / OAuth mock)</p>

    <div class="card">
      <label for="text">회의록·녹취록 텍스트</label>
      <textarea id="text" placeholder="여기에 회의 텍스트를 붙여넣으세요."></textarea>
    </div>

    <div class="card">
      <label>옵션 (데모에서는 고정값 사용)</label>
      <div class="row">
        <button id="btn-extract">추출하기</button>
        <button id="btn-save" class="secondary" disabled>노션·캘린더에 저장</button>
        <button id="btn-session" class="secondary">새 세션</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div id="result-area" class="result" hidden>
      <div class="card">
        <h3>추출 결과</h3>
        <div id="tasks"></div>
        <div id="save-links" hidden class="save-url"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const BACKEND_URL = (window.__BACKEND_URL__ || "").replace(/\/+$/, "") || "https://meetingpick-backend.onrender.com";

      const $ = (id) => document.getElementById(id);
      const textEl = $("text");
      const btnExtract = $("btn-extract");
      const btnSave = $("btn-save");
      const btnSession = $("btn-session");
      const statusEl = $("status");
      const resultArea = $("result-area");
      const tasksEl = $("tasks");
      const saveLinksEl = $("save-links");

      let sessionId = loadSession();

      function loadSession() {
        try {
          const v = localStorage.getItem("mpt_session_id");
          if (v) return v;
        } catch (e) { /* ignore */ }
        return null;
      }

      function saveSession(id) {
        try {
          localStorage.setItem("mpt_session_id", id);
        } catch (e) { /* ignore */ }
        sessionId = id;
      }

      function authHeaders() {
        return sessionId
          ? { Authorization: `Bearer ${sessionId}` }
          : {};
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.classList.toggle("error", !!isError);
      }

      function renderTasks(result) {
        tasksEl.innerHTML = "";
        if (!result.tasks || result.tasks.length === 0) {
          tasksEl.innerHTML = "<p>추출된 할 일이 없습니다.</p>";
          return;
        }

        result.tasks.forEach((t, i) => {
          const box = document.createElement("div");
          box.className = "task";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `
            <span class="badge">확신도: ${t.confidence}</span>
            <span class="badge">근거: ${t.assignee_rationale}</span>
            ${t.assignee_name ? `<span class="badge">담당자: ${t.assignee_name}</span>` : ""}
            ${t.due_date ? `<span class="badge">마감: ${t.due_date.toISOString().slice(0,10)}</span>` : ""}
            <span class="badge">마감 명확도: ${t.due_clarity}</span>
          `;
          box.appendChild(meta);

          const text = document.createElement("div");
          text.className = "text";
          text.textContent = t.text;
          box.appendChild(text);

          if (t.highlights && t.highlights.length) {
            const h = t.highlights[0];
            const snippet = document.createElement("div");
            snippet.className = "highlight-snippet";
            snippet.textContent = `근거: “${h.snippet}”`;
            box.appendChild(snippet);
          }

          tasksEl.appendChild(box);
        });
      }

      async function extract() {
        const text = textEl.value.trim();
        if (!text) {
          setStatus("텍스트를 입력해주세요.", true);
          return;
        }
        setStatus("추출 중…");
        btnExtract.disabled = true;

        try {
          const res = await fetch(`${BACKEND_URL}/api/extract`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...authHeaders(),
            },
            body: JSON.stringify({ text }),
          });

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || `HTTP ${res.status}`);
          }

          const result = await res.json();
          saveSession(result.session_id);

          renderTasks(result);
          resultArea.hidden = false;
          saveLinksEl.hidden = true;
          btnSave.disabled = false;
          setStatus(`추출 완료 — ${result.tasks?.length || 0}개 항목`);
        } catch (e) {
          setStatus(`추출 실패: ${e.message}`, true);
        } finally {
          btnExtract.disabled = false;
        }
      }

      async function save() {
        const text = textEl.value.trim();
        if (!text) {
          setStatus("텍스트를 먼저 입력해주세요.", true);
          return;
        }
        setStatus("저장 중…");
        btnSave.disabled = true;

        try {
          const res = await fetch(`${BACKEND_URL}/api/save`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...authHeaders(),
            },
            body: JSON.stringify({ text }),
          });

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || `HTTP ${res.status}`);
          }

          const data = await res.json();
          saveLinksEl.innerHTML = "";
          if (data.notion_url) {
            const n = document.createElement("div");
            n.innerHTML = `<strong>Notion 페이지:</strong> <a href="${data.notion_url}" target="_blank">${data.notion_url}</a>`;
            saveLinksEl.appendChild(n);
          }
          if (data.google_calendar_url) {
            const g = document.createElement("div");
            g.innerHTML = `<strong>Google 캘린더 이벤트:</strong> <a href="${data.google_calendar_url}" target="_blank">${data.google_calendar_url}</a>`;
            saveLinksEl.appendChild(g);
          }
          if (!data.notion_url && !data.google_calendar_url) {
            saveLinksEl.textContent = "저장 링크가 없습니다. (OAuth 미설정 상태)";
          }
          saveLinksEl.hidden = false;
          setStatus("저장 완료 (mock)");
        } catch (e) {
          setStatus(`저장 실패: ${e.message}`, true);
        } finally {
          btnSave.disabled = false;
        }
      }

      async function newSession() {
        setStatus("새 세션 발급 중…");
        try {
          const res = await fetch(`${BACKEND_URL}/api/session`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          saveSession(data.session_id);
          setStatus(`새 세션 발급: ${data.session_id}`);
        } catch (e) {
          setStatus(`세션 발급 실패: ${e.message}`, true);
        }
      }

      btnExtract.addEventListener("click", extract);
      btnSave.addEventListener("click", save);
      btnSession.addEventListener("click", newSession);
    })();
  </script>
</body>
</html>
